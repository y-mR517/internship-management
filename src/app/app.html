<div style="max-width: 500px; margin: 40px auto; font-family: Arial, SansSerif;">
  <h2>Field Internship Management System</h2>
  <h3>Log Daily Activity</h3>

  <form (ngSubmit)="onSubmitActivity()" #activityForm="ngForm">
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;">Student ID</label>
      <input type="number" [(ngModel)]="activity.studentId" name="studentId" required style="width: 100%; padding: 8px; margin-bottom: 5px;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;">Activity Date</label>
      <input type="date" [(ngModel)]="activity.activityDate" name="activityDate" required style="width: 100%; padding: 8px; margin-bottom: 5px;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;">Task Description</label>
      <textarea [(ngModel)]="activity.taskDescription" name="taskDescription" rows="6" required style="width: 100%; padding: 8px; margin-bottom: 5px;"></textarea>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;">Hours Spent</label>
      <input type="number" step="0.1" [(ngModel)]="activity.hoursSpent" name="hoursSpent" required style="width: 100%; padding: 8px; margin-bottom: 5px;">
    </div>

    <button type="submit" style="background-color: aqua; color: aliceblue; padding: 10px 20px; border: none; cursor: pointer; margin-top: 20px; margin-bottom: 20px;">
      Submit Activity
    </button>

  </form>

  <!--Success/Error Feedback Message-->
  <p *ngIf="message" style="color: green; margin-top: 15px; font-weight: bold;">{{ message }}</p>
  <p *ngIf="errorMessage" style="color: red; margin-top: 15px; font-weight: bold">{{ errorMessage }}</p>
</div>
